  <circle cx="168" cy="58" r="5" fill="#a8c5a0" opacity="0.9"/>
  <circle cx="163" cy="65" r="5" fill="#a8c5a0" opacity="0.9"/>
  <circle cx="155" cy="65" r="5" fill="#a8c5a0" opacity="0.9"/>
  <circle cx="161" cy="58" r="6.5" fill="#c5dcc0"/>

