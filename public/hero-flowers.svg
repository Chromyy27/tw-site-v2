  <circle cx="110" cy="45" r="7" fill="#c9a96e" opacity="0.9"/>
  <circle cx="115" cy="54" r="7" fill="#c9a96e" opacity="0.9"/>
  <circle cx="108" cy="63" r="7" fill="#c9a96e" opacity="0.9"/>
  <circle cx="98" cy="63" r="7" fill="#c9a96e" opacity="0.9"/>
  <circle cx="93" cy="54" r="7" fill="#c9a96e" opacity="0.9"/>
  <circle cx="104" cy="54" r="9" fill="#e8c987"/>

  <!-- Right stem -->
  <path d="M158 125 Q162 98 156 65" stroke="#4a6741" stroke-width="2.5" fill="none" stroke-linecap="round"/>
