  <ellipse cx="48" cy="76" rx="11" ry="5" fill="#3d5c35" opacity="0.8" transform="rotate(20 48 76)"/>
  <!-- Left flower -->
  <circle cx="42" cy="66" r="5.5" fill="#b8a4c8" opacity="0.85"/>
  <circle cx="50" cy="62" r="5.5" fill="#b8a4c8" opacity="0.85"/>
  <circle cx="55" cy="68" r="5.5" fill="#b8a4c8" opacity="0.85"/>
  <circle cx="50" cy="74" r="5.5" fill="#b8a4c8" opacity="0.85"/>
  <circle cx="42" cy="74" r="5.5" fill="#b8a4c8" opacity="0.85"/>
  <circle cx="48" cy="68" r="6.5" fill="#d4c0e0"/>

